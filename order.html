<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Now | Homemade Cravings Bakery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .order-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
        }
        .order-form-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; 
        }
        .cart-summary {
            background: var(--primary);
            color: white;
            padding: 40px;
            border-radius: 20px;
            height: fit-content;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="container">
            <div class="logo">Homemade Cravings</div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="order.html">Order Now</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="cart-icon"><i class="fa-solid fa-cart-shopping"></i><span class="cart-count">0</span></div>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="section-title">
                <h2>Secure Your Order</h2>
                <p>Complete the details below to finalize your purchase.</p>
            </div>

            <div class="order-container">
                <div class="order-form-box">
                    <h3>Delivery Information</h3>
                    <form id="main-order-form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" required>
                        </div>
                        <div class="form-group">
                            <label>Delivery Address</label>
                            <input type="text" required>
                        </div>
                        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <label>Delivery Date</label>
                                <input type="date" required>
                            </div>
                            <div>
                                <label>Delivery Time</label>
                                <select>
                                    <option>Morning (9am - 12pm)</option>
                                    <option>Afternoon (12pm - 4pm)</option>
                                    <option>Evening (4pm - 7pm)</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 20px;">Place Order</button>
                    </form>
                </div>

                <div class="cart-summary">
                    <h3>Order Summary</h3>
                    <div style="margin-top: 30px;">
                        <div class="summary-item">
                            <span>Subtotal</span>
                            <span>$0.00</span>
                        </div>
                        <div class="summary-item">
                            <span>Delivery Fee</span>
                            <span>$5.00</span>
                        </div>
                        <div class="summary-item" style="border: none; font-size: 1.5rem; font-weight: 700;">
                            <span>Total</span>
                            <span>$5.00</span>
                        </div>
                    </div>
                    <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 20px;">
                        <i class="fa-solid fa-lock"></i> SSL Encrypted Checkout
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
